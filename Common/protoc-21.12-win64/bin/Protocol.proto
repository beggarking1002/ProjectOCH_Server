syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

message C_LOGIN
{

}

message S_LOGIN
{
	bool success = 1;
}

message C_ENTER_GAME
{
	uint64 playerIndex = 1;
}

message S_ENTER_GAME
{
	bool success = 1;
	ObjectInfo player = 2;
}

message C_LEAVE_GAME
{

}

message S_LEAVE_GAME
{

}

message S_SPAWN
{
	repeated ObjectInfo players = 1;
}

message S_DESPAWN
{
	repeated uint64 object_ids = 1;
}

message C_MOVE
{
	Vec2Fixed target = 1;
}

message S_MOVE
{
    uint64 object_id = 1;
    Vec2Fixed start = 2;
    Vec2Fixed target = 3;
    uint32 duration_ms = 4;
    // Waypoints excluding start and including target. Used for server-authoritative field routing.
    repeated Vec2Fixed path = 5;
}

message C_CHAT
{
	string msg = 1;
}

message S_CHAT
{
	uint64 playerId = 1;
	string msg = 2;
}

message C_ENTER_BATTLE
{

}

message S_ENTER_BATTLE
{
	bool success = 1;
	uint64 battle_id = 2;
	string map_id = 3;

	repeated BattlePawnInfo allied_pawns = 4;
	repeated BattlePawnInfo enemy_pawns = 5;

	uint64 current_turn_pawn_id = 6;
	string reason = 7;
  uint64 battle_state_version = 8;
  repeated BattleTileInfo tiles = 9;
  repeated uint64 upcoming_turn_pawn_ids = 10;
}

message C_BATTLE_MOVE
{
	uint64 battle_id = 1;
	uint64 pawn_id = 2;
	AxialCoord target = 3;
}

message S_BATTLE_MOVE
{
	bool success = 1;
	uint64 battle_id = 2;
	uint64 pawn_id = 3;

	AxialCoord start = 4;
	AxialCoord target = 5;

	uint64 next_turn_pawn_id = 6;
	BattleMoveResult result = 7;
	string reason = 8;
	bool can_move = 10;
	repeated BattlePawnDelta pawn_deltas = 11;
	repeated BattleActionLog logs = 12;
  uint64 battle_state_version = 13;
  bool turn_queue_resynced = 14;
  repeated uint64 upcoming_turn_pawn_ids = 15;
  repeated AxialCoord path = 16;
}

message C_BATTLE_SKILL {
	uint64 battle_id = 1;
	uint64 caster_pawn_id = 2;
	int32 skill_slot = 3;
	uint64 target_pawn_id = 4;
	AxialCoord target_axial = 5;
	AxialCoord line_direction_axial = 6;
	bool request_optional_position_swap = 7;
}

message S_BATTLE_SKILL {
	bool success = 1;
	uint64 battle_id = 2;
	uint64 caster_pawn_id = 3;
	int32 skill_slot = 4;
	uint64 target_pawn_id = 5;
	AxialCoord target_axial = 6;
	int32 damage = 7;
	int32 target_hp = 8;
	uint64 next_turn_pawn_id = 9;
	string reason = 10;
	bool can_move = 12;
	bool used_sub_action_this_turn = 13;
	bool used_ultimate = 14;
	int32 target_armor = 15;
	repeated BattlePawnDelta pawn_deltas = 16;
	repeated BattleActionLog logs = 17;
	uint64 battle_state_version = 18;
  repeated BattleTileInfo tile_deltas = 19;
  bool turn_queue_resynced = 20;
  repeated uint64 upcoming_turn_pawn_ids = 21;
}

message C_BATTLE_END_TURN {
	uint64 battle_id = 1;
	uint64 pawn_id = 2;
}

message S_BATTLE_END_TURN {
	bool success = 1;
	uint64 battle_id = 2;
	uint64 pawn_id = 3;
	uint64 next_turn_pawn_id = 4;
	string reason = 5;
	bool can_move = 7;
	bool used_sub_action_this_turn = 8;
	bool used_ultimate = 9;
	repeated BattlePawnDelta pawn_deltas = 10;
	repeated BattleActionLog logs = 11;
	uint64 battle_state_version = 12;
  repeated BattleTileInfo tile_deltas = 13;
  uint64 entering_turn_pawn_id = 14;
  bool turn_queue_resynced = 15;
  repeated uint64 upcoming_turn_pawn_ids = 16;
}

message C_BATTLE_INVITE {
	uint64 target_player_id = 1;
}

message S_BATTLE_INVITE_REQUEST {
	bool success = 1;
	uint64 requester_player_id = 2;
	uint64 target_player_id = 3;
	string reason = 4;
}

message S_BATTLE_INVITE_RECEIVED {
	uint64 requester_player_id = 1;
}

message C_BATTLE_INVITE_RESPONSE {
	uint64 requester_player_id = 1;
	bool accept = 2;
}

message S_BATTLE_INVITE_RESULT {
	bool accepted = 1;
	uint64 requester_player_id = 2;
	uint64 target_player_id = 3;
	string reason = 4;
}

message S_BATTLE_PAWN_DEAD {
	uint64 battle_id = 1;
	uint64 pawn_id = 2;
	uint64 killer_pawn_id = 3;
}

message S_BATTLE_RESULT {
	uint64 battle_id = 1;
	bool victory = 2;
}

message C_BATTLE_RESULT_ACK {
	uint64 battle_id = 1;
}

message S_BATTLE_RESULT_ACK {
	bool success = 1;
	uint64 battle_id = 2;
	string reason = 3;
}

message S_BATTLE_CLASS_SELECTION_START {
	uint64 requester_player_id = 1;
	uint64 target_player_id = 2;
	repeated PawnClass suen_options = 3;
	repeated PawnClass beige_options = 4;
	repeated PawnClass alen_options = 5;
	repeated PawnClass zillian_options = 6;
}

message C_BATTLE_CLASS_SELECTION {
	repeated PawnClass selected_pawn_classes = 1;
}

message S_BATTLE_CLASS_SELECTION_RESULT {
	bool success = 1;
	bool waiting_for_opponent = 2;
	uint64 requester_player_id = 3;
	uint64 target_player_id = 4;
	string reason = 5;
}
