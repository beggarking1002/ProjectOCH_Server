syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

message C_LOGIN
{

}

message S_LOGIN
{
	bool success = 1;
}

message C_ENTER_GAME
{
	uint64 playerIndex = 1;
}

message S_ENTER_GAME
{
	bool success = 1;
	ObjectInfo player = 2;
}

message C_LEAVE_GAME
{

}

message S_LEAVE_GAME
{

}

message S_SPAWN
{
	repeated ObjectInfo players = 1;
}

message S_DESPAWN
{
	repeated uint64 object_ids = 1;
}

message C_MOVE
{
	Vec2Fixed target = 1;
}

message S_MOVE
{
    uint64 object_id = 1;
    Vec2Fixed start = 2;
    Vec2Fixed target = 3;
    uint32 duration_ms = 4;
}

message C_CHAT
{
	string msg = 1;
}

message S_CHAT
{
	uint64 playerId = 1;
	string msg = 2;
}

message C_ENTER_BATTLE
{

}

message S_ENTER_BATTLE
{
	bool success = 1;
	uint64 battle_id = 2;
	string map_id = 3;

	repeated BattlePawnInfo allied_pawns = 4;
	repeated BattlePawnInfo enemy_pawns = 5;

	uint64 current_turn_pawn_id = 6;
	string reason = 7;
}

message C_BATTLE_MOVE
{
	uint64 battle_id = 1;
	uint64 pawn_id = 2;
	AxialCoord target = 3;
}

message S_BATTLE_MOVE
{
	bool success = 1;
	uint64 battle_id = 2;
	uint64 pawn_id = 3;

	AxialCoord start = 4;
	AxialCoord target = 5;

	uint64 next_turn_pawn_id = 6;
	BattleMoveResult result = 7;
	string reason = 8;
}

message C_BATTLE_SKILL {
	uint64 battle_id = 1;
	uint64 caster_pawn_id = 2;
	int32 skill_slot = 3;
	uint64 target_pawn_id = 4;
	AxialCoord target_axial = 5;
}

message S_BATTLE_SKILL {
	bool success = 1;
	uint64 battle_id = 2;
	uint64 caster_pawn_id = 3;
	int32 skill_slot = 4;
	uint64 target_pawn_id = 5;
	AxialCoord target_axial = 6;
	int32 damage = 7;
	int32 target_hp = 8;
	uint64 next_turn_pawn_id = 9;
	string reason = 10;
}

message C_BATTLE_END_TURN {
	uint64 battle_id = 1;
	uint64 pawn_id = 2;
}

message S_BATTLE_END_TURN {
	bool success = 1;
	uint64 battle_id = 2;
	uint64 pawn_id = 3;
	uint64 next_turn_pawn_id = 4;
	string reason = 5;
}
