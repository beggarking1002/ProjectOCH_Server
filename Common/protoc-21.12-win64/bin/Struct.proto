syntax = "proto3";
package Protocol;

import "Enum.proto";

message Vec2Fixed
{
	sint32 x = 1;
	sint32 y = 2;
}

message AxialCoord
{
	sint32 q = 1;
	sint32 r = 2;
}

message ObjectInfo
{
	uint64 object_id = 1;
	ObjectType object_type = 2;
	CreatureType creature_type = 3;
	Vec2Fixed position = 4;
}

message BattlePawnInfo
{
	uint64 pawn_id = 1;
	uint64 owner_id = 2;
	PawnClass pawn_class = 3;
	AxialCoord axial = 4;
	int32 hp = 5;
	int32 max_hp = 6;
	int32 move_range = 7;
	int32 armor = 8;
	int32 max_armor = 9;
	int32 current_ap = 10;
	bool can_move = 11;
	bool used_sub_action_this_turn = 12;
	bool used_ultimate = 13;
	bool is_shield_unit = 14;
	bool is_melee = 15;
	bool is_dead = 16;
}

message BattlePawnDelta
{
	uint64 pawn_id = 1;
	int32 hp = 2;
	int32 armor = 3;
	int32 current_ap = 4;
	bool can_move = 5;
	bool used_sub_action_this_turn = 6;
	bool used_ultimate = 7;
	bool is_dead = 8;
}

message BattleActionLog
{
	uint64 attacker_pawn_id = 1;
	uint64 defender_pawn_id = 2;
	int32 skill_slot = 3;
	string action_type = 4;
	int32 damage = 5;
	bool is_critical = 6;
	bool is_evaded = 7;
	bool is_guarded = 8;
	bool is_perfect_guarded = 9;
	bool is_counter = 10;
	int32 hp_after = 11;
	int32 armor_after = 12;
}
