syntax = "proto3";
package Protocol;

import "Struct.proto";

message C_LOGIN
{

}

message S_LOGIN
{
	bool success = 1;
}

message C_ENTER_GAME
{
	uint64 playerIndex = 1;
}

message S_ENTER_GAME
{
	bool success = 1;
	ObjectInfo player = 2;
}

message C_LEAVE_GAME
{

}

message S_LEAVE_GAME
{

}

message S_SPAWN
{
	repeated ObjectInfo players = 1;
}

message S_DESPAWN
{
	repeated uint64 object_ids = 1;
}

message C_MOVE
{
	Vec2Fixed target = 1;
}

message S_MOVE
{
    uint64 object_id = 1;
    Vec2Fixed start = 2;
    Vec2Fixed target = 3;
    uint32 duration_ms = 4;
    // Waypoints excluding start and including target. Used for server-authoritative field routing.
    repeated Vec2Fixed path = 5;
}

message C_CHAT
{
	string msg = 1;
}

message S_CHAT
{
	uint64 playerId = 1;
	string msg = 2;
}

message C_ENTER_VILLAGE
{
	string map_id = 1;
	sint32 cell_x = 2;
	sint32 cell_y = 3;
}

message S_ENTER_VILLAGE
{
	bool success = 1;
	string reason = 2;
	string village_id = 3;
	string village_name = 4;
	string village_description = 5;
}
